name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Settings window smoke test
        continue-on-error: true
        run: .\target\release\winbend.exe --ui-test 8
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item target/release/winbend.exe, dist/README.txt, LICENSE stage/
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Compress-Archive -Path stage/* -DestinationPath "WinBend-$v-win64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: WinBend-win64
          path: WinBend-*-win64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WinBend-*-win64.zip
          generate_release_notes: true
